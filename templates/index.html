<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🚀 DevOps System Dashboard</h1>

        <div class="dashboard">

            <div class="card">
                <h2>🖥 CPU</h2>
                <p>{{ cpu }} %</p>
            </div>

            <div class="card">
                <h2>💾 RAM</h2>
                <p>{{ ram }} %</p>
            </div>

            <div class="card">
                <h2>💽 Disk</h2>
                <p>{{ disk }} %</p>
            </div>

            <div class="card">
                <h2>🪟 OS</h2>
                <p>{{ os }}</p>
            </div>

            <div class="card">
                <h2>🕒 Time</h2>
                <p>{{ current_time }}</p>
            </div>

        </div>

    </div>

</body>

</html>
